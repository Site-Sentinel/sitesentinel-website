name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Run all checks to collect useful failures. Report and enforce below
      # fails the job if ANY required step failed, was skipped or was cancelled.
      - name: Safeguard wiring
        id: guardrails
        continue-on-error: true
        run: pnpm check:guardrails

      - name: Content is valid
        id: content
        continue-on-error: true
        run: pnpm check:content

      - name: No em dashes or en dashes
        id: dashes
        continue-on-error: true
        run: pnpm check:dashes

      - name: Copy and colour rules
        id: copy
        continue-on-error: true
        run: pnpm check:copy

      - name: Types are correct
        id: types
        continue-on-error: true
        run: pnpm check:types

      - name: Code is formatted
        id: format
        continue-on-error: true
        run: pnpm check:format

      - name: Code passes lint
        id: lint
        continue-on-error: true
        run: pnpm check:lint

      - name: Repeated markup review (advisory)
        id: repeats
        continue-on-error: true
        run: pnpm check:repeats

      - name: Safeguard regression tests
        id: tests
        continue-on-error: true
        run: pnpm check:tests

      - name: Site builds and local links resolve
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Report and enforce results
        if: always()
        env:
          CHECK_RESULTS: >-
            {"install": "${{ steps.install.outcome }}", "guardrails": "${{ steps.guardrails.outcome }}", "content": "${{ steps.content.outcome }}", "dashes": "${{ steps.dashes.outcome }}", "copy": "${{ steps.copy.outcome }}", "types": "${{ steps.types.outcome }}", "format": "${{ steps.format.outcome }}", "lint": "${{ steps.lint.outcome }}", "repeats": "${{ steps.repeats.outcome }}", "tests": "${{ steps.tests.outcome }}", "build": "${{ steps.build.outcome }}"}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_REPORT_PATH: ${{ runner.temp }}/checks-report.md
        run: node tools/report-checks.mjs

      - name: Update pull request results table
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          CHECK_REPORT_PATH: ${{ runner.temp }}/checks-report.md
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync(process.env.CHECK_REPORT_PATH)) {
              core.warning('The results table could not be generated. Inspect the failed job.');
              return;
            }
            const body = fs.readFileSync(process.env.CHECK_REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('<!-- sitesentinel-checks-report -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  production-readiness:
    name: Production readiness
    runs-on: ubuntu-latest
    # Only on main. Feature branches are allowed to still have placeholder
    # images, so a work in progress can be reviewed.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: No placeholder images remain
        id: placeholders
        continue-on-error: true
        env:
          CHECK_STRICT_IMAGES: '1'
        run: pnpm check:content

      - name: Report remaining placeholders
        if: steps.placeholders.outcome == 'failure'
        run: |
          echo "### Images still missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The site builds and deploys, but some photographs are still grey placeholder panels." >> $GITHUB_STEP_SUMMARY
          echo "Drop the real files into \`public/images/\` at the paths listed in the log above." >> $GITHUB_STEP_SUMMARY
