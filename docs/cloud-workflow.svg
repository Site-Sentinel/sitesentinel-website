<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Website editing through Codex Cloud</title>
  <desc id="desc">Choose Codex and Cloud in ChatGPT desktop, connect GitHub and select the repository. Request a change, review its Netlify preview on computer and phone, then approve publishing.</desc>
  <rect width="960" height="410" rx="16" fill="#f4f7fa"/>
  <g font-family="Arial, sans-serif" fill="#12304c">
    <text x="30" y="42" font-size="25" font-weight="700">Your website workflow</text>
    <text x="30" y="70" font-size="16">Illustrative guide. Menu labels can vary by app version.</text>
    <g fill="white" stroke="#12304c" stroke-width="2">
      <rect x="30" y="98" width="275" height="115" rx="10"/>
      <rect x="342" y="98" width="275" height="115" rx="10"/>
      <rect x="654" y="98" width="275" height="115" rx="10"/>
      <rect x="30" y="266" width="275" height="115" rx="10"/>
      <rect x="342" y="266" width="275" height="115" rx="10"/>
      <rect x="654" y="266" width="275" height="115" rx="10"/>
    </g>
    <g font-size="19" font-weight="700">
      <text x="48" y="130">1. ChatGPT desktop</text>
      <text x="360" y="130">2. Connect GitHub</text>
      <text x="672" y="130">3. Select the repository</text>
      <text x="48" y="298">4. Request a change</text>
      <text x="360" y="298">5. Review the preview</text>
      <text x="672" y="298">6. Approve publishing</text>
    </g>
    <g font-size="16">
      <text x="48" y="163">Select Codex</text><text x="48" y="189">New chat: Work in &gt; Cloud</text>
      <text x="360" y="163">Use your own account</text><text x="360" y="189">Allow repository access</text>
      <text x="672" y="163">Site-Sentinel /</text><text x="672" y="189">sitesentinel-website</text>
      <text x="48" y="331">Codex edits a separate branch</text><text x="48" y="357">GitHub PR triggers Netlify</text>
      <text x="360" y="331">Open the Netlify link</text><text x="360" y="357">Check computer and phone</text>
      <text x="672" y="331">Merge only after approval</text><text x="672" y="357">Verify production deployment</text>
    </g>
    <g font-size="28"><text x="313" y="165">→</text><text x="625" y="165">→</text><text x="313" y="333">→</text><text x="625" y="333">→</text></g>
    <text x="30" y="245" font-size="16" font-weight="700">After setup: repeat steps 4 to 6 for each change.</text>
  </g>
</svg>
